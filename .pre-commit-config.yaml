# Local compliance — fast per-commit lint/format (no GitHub Actions in the loop).
#
# Why this shape: pre-commit's `language: system` cannot reliably spawn the relative
# Windows venv path (`.venv\Scripts\*.exe`) — forward slashes fail CreateProcess and
# backslashes get stripped. So ruff runs via pre-commit's own pinned, managed env
# (matched to the venv's ruff version), and the FULL gate — ruff + mypy-strict +
# pytest(+coverage>=95) — runs from the venv via `scripts/check.sh` (mypy/pytest need
# the HA-aware venv, which pre-commit's isolated envs can't provide cheaply).
#
# Install once (after the venv exists — see CLAUDE.md):  .venv/Scripts/pre-commit install
# Run on demand:                                          .venv/Scripts/pre-commit run --all-files
# Before pushing (full gate):                             ./scripts/check.sh
minimum_pre_commit_version: "3.5.0"
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16  # keep in lockstep with ruff in requirements_test.txt
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
