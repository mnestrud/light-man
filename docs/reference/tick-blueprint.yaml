    _a3_bri: '{{ [state_attr(ov3, ''brightness_pct'') | float(_g_bri) | round(0)
      | int,1] | max if ov3 else _g_bri }}'
    _a3_kel: '{{ state_attr(ov3, ''color_temp_kelvin'') | float(_g_kel) if ov3
      else _g_kel }}'
