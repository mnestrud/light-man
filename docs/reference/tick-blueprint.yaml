- choose:
  - conditions:
    - condition: template
      value_template: '{{ _log }}'
    sequence:
    - action: logbook.log
      data:
        name: Ataraxia AL
        message: 'Tick: bri={{ _g_bri }}, K={{ _g_kel }}, stagger={{ _stagger
          }}s'
        entity_id: !input timer_entity
- choose:
  - conditions:
    - condition: state
      entity_id: !input z2m_bridge
      state: 'on'
    sequence:
    - repeat:
        for_each: '{{ areas }}'
        sequence:
        - condition: template
          value_template: "{{ repeat.item.enable is not none and repeat.item.light
            is not none and\n   repeat.item.script is not none and is_state(repeat.item.enable,
            'on') }}\n"
        - condition: template
          value_template: '{{ states(repeat.item.light) not in [''unavailable'',''unknown'']
            }}

            '
        - variables:
            _is_on: '{{ is_state(repeat.item.light, ''on'') }}'
            _target_state: '{{ ''ON'' if _is_on else ''OFF'' }}'
            _src: '{{ repeat.item.src }}'
            _pub_bri: "{{ 0 if ((_last.get(_src, {}).get('b', -99) | int(-99)) == (repeat.item.bri | int(-1))) else 1 }}"
            _pub_kel: "{{ 0 if ((_last.get(_src, {}).get('k', -99) | int(-99)) == (repeat.item.kel | float(-1) | round(0) | int)) else 1 }}"
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _log }}'
            sequence:
            - action: logbook.log
              data:
                name: Ataraxia AL
                message: 'Area {{ repeat.index }}: light={{ repeat.item.light
                  }}, script={{ repeat.item.script }}, {{ _target_state }}, bri={{
                  repeat.item.bri }}, K={{ repeat.item.kel }}'
                entity_id: '{{ repeat.item.light }}'
        - action: script.turn_on
          target:
            entity_id: '{{ repeat.item.script }}'
          data:
            variables:
              target_state: '{{ _target_state }}'
              brightness_pct: '{{ repeat.item.bri }}'
              color_temp_kelvin: '{{ repeat.item.kel }}'
              transition: '{{ 0 if _target_state == "OFF" else _transition }}'
              bri_changed: '{{ _pub_bri }}'
              kel_changed: '{{ _pub_kel }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ not repeat.last }}'
            sequence:
            - delay:
                seconds: '{{ _stagger | int(0) }}'
    # Keyed-JSON write-back: one entry per AL source (representative value per source — all areas
    # on a source share the same value). overhead = global switch; accent/hallup/halldown = overrides.
    - action: input_text.set_value
      target:
        entity_id: input_text.al_last_published
      data:
        value: >-
          {{ {'overhead': {'b': _g_bri | int, 'k': _g_kel | float | round(0) | int},
              'accent':   {'b': _a4_bri | int, 'k': _a4_kel | float | round(0) | int},
              'hallup':   {'b': _a15_bri | int, 'k': _a15_kel | float | round(0) | int},
              'halldown': {'b': _a12_bri | int, 'k': _a12_kel | float | round(0) | int}} | to_json }}
    # Tick counter — drift-check (every 2nd tick) + liveness signal
    - action: input_number.increment
      target:
        entity_id: input_number.al_tick_count
- action: timer.start
  target:
    entity_id: !input timer_entity
  data:
    duration: '{{ _rest }}'
