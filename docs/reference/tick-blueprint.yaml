blueprint:
  name: Ataraxia Lighting – Master Tick Automation (v1.0rc10)
  description: 'Timer-driven fan-out to up to 15 areas. Uses a global AL switch (optional
    per-area overrides). Reads values once per tick, applies to active areas only.
    Timer is restarted AFTER fan-out completes (rest-period model). Includes
    availability checks and optional debug logging.

    '
  domain: automation
  author: mnestrud
  input:
    timer_entity:
      name: Timer
      description: Heartbeat timer entity; started after fan-out completes.
      selector:
        entity:
          domain:
          - timer
          multiple: false
          reorder: false
    rest_duration:
      name: Rest duration after fan-out
      description: How long to wait after fan-out completes before the next tick (HH:MM:SS).
      default: '00:00:20'
      selector:
        text:
          multiple: false
          multiline: false
    z2m_bridge:
      name: Zigbee2MQTT Bridge Online Sensor
      description: Used to gate fan-out work.
      selector:
        entity:
          domain:
          - binary_sensor
          multiple: false
          reorder: false
    global_al_switch:
      name: Global Adaptive Lighting Values Control Switch
      description: Default brightness/K source for all areas.
      selector:
        entity:
          domain:
          - switch
          multiple: false
          reorder: false
    per_area_delay:
      name: Per-area stagger (seconds)
      description: Delay between areas.
      default: 4
      selector:
        number:
          min: 0.0
          max: 60.0
          step: 1.0
          mode: slider
    transition:
      name: Transition (seconds) – optional
      description: Blank = no transition. Applied only when lights are ON. OFF-state prestaging always uses transition 0.
      default: ''
      selector:
        text:
          multiple: false
          multiline: false
    verbose_logging:
      name: Debug logging (tick + per-area)
      description: When on, write Logbook entries.
      default: false
      selector:
        boolean: {}
    a1_enable:
      name: Area 1 – AL Area Active - Toggle Switch
      default:
      selector:
        entity:
          domain:
          - input_boolean
          multiple: false
          reorder: false
    a1_light:
      name: Area 1 – Controlling Light Switch - it has on/off state of light
      default:
      selector:
        entity:
          domain:
          - light
          multiple: false
          reorder: false
    a1_script:
      name: Area 1 – AL Ataraxia Script for Area
      default:
      selector:
        entity:
          domain:
          - script
          multiple: false
          reorder: false
    a1_al_switch_override:
      name: Area 1 – Adaptive Lighting Values Area Override Control Switch
      default:
      selector:
        entity:
          domain:
          - switch
          multiple: false
          reorder: false
