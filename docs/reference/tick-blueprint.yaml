    _a13_bri: '{{ [state_attr(ov13, ''brightness_pct'') | float(_g_bri) | round(0)
      | int,1] | max if ov13 else _g_bri }}'
    _a13_kel: '{{ state_attr(ov13, ''color_temp_kelvin'') | float(_g_kel) if ov13
      else _g_kel }}'
    _a14_bri: '{{ [state_attr(ov14, ''brightness_pct'') | float(_g_bri) | round(0)
      | int,1] | max if ov14 else _g_bri }}'
    _a14_kel: '{{ state_attr(ov14, ''color_temp_kelvin'') | float(_g_kel) if ov14
      else _g_kel }}'
    _a15_bri: '{{ [state_attr(ov15, ''brightness_pct'') | float(_g_bri) | round(0)
      | int,1] | max if ov15 else _g_bri }}'
    _a15_kel: '{{ state_attr(ov15, ''color_temp_kelvin'') | float(_g_kel) if ov15
      else _g_kel }}'
    # a16-a19 = consolidated per-source pushes; reuse the already-computed per-room representative
    # values (a16 overhead=global; a17 accent=_a4; a18 hallup=_a15; a19 halldown=_a12).
    _a16_bri: '{{ _g_bri }}'
    _a16_kel: '{{ _g_kel }}'
    _a17_bri: '{{ _a4_bri }}'
    _a17_kel: '{{ _a4_kel }}'
    _a18_bri: '{{ _a15_bri }}'
    _a18_kel: '{{ _a15_kel }}'
    _a19_bri: '{{ _a12_bri }}'
    _a19_kel: '{{ _a12_kel }}'
    # KEYED-JSON dedup state (replaces the old positional CSV helpers al_last_bri/al_last_kel).
    # input_text.al_last_published holds one entry per AL SOURCE (not per area):
    #   {"overhead":{"b":<pct>,"k":<kelvin>},"accent":{...},"hallup":{...},"halldown":{...}}
    # Each area maps to its source via its AL-override switch (_src_map); areas with no override
    # inherit the global switch = overhead source. Keying by source NAME removes the old
    # positional-index fragility — the dedup flags (_pub_bri/_pub_kel), the helper write-back below,
    # the drift-check reconcile loop, and the occupancy automations all reference by source KEY now.
    _src_map:
      switch.adaptive_lighting_accent_light_adaptive_lighting_control: accent
      switch.hallway_downlights_adaptive_adaptive_lighting_hallway_downlights_adaptive: halldown
      switch.hallway_uplights_adaptive_adaptive_lighting_hallway_uplights_adaptive: hallup
    _last: "{{ (states('input_text.al_last_published') | from_json) if states('input_text.al_last_published')[0:1] == '{' else {} }}"
    areas:
    - enable: !input a1_enable
      light: !input a1_light
      script: !input a1_script
      bri: '{{ _a1_bri }}'
      kel: '{{ _a1_kel }}'
      src: "{{ _src_map.get(ov1, 'overhead') if ov1 else 'overhead' }}"
    - enable: !input a2_enable
      light: !input a2_light
      script: !input a2_script
