blueprint:
  name: Ataraxia Lighting - Inovelli Switch Taps (v1.1.0)
  description: "Inovelli Blue 2-in-1 (Zigbee2MQTT) multi-tap automation. Adaptive
    looks, holds, and all bulb-value publishing live in the Light Man integration;
    this blueprint never publishes brightness/color to overhead lights and only
    sends LED-bar effects to the switch.\n- Config single/double = LED-bar hold
    indicator (Solid) + accent off\n- Up/Down single = accent on/off + optional
    Action (scene/script/light) + LED clear on down\n- Up/Down double & triple =
    optional Action (scene/script/light) + optional LED effect\n- Up/Down Held =
    smooth brightness ramp for assigned wired-load targets (e.g. guest fan)\n-
    RESET_LED (light off 1s) = LED-bar clear\n\nv1.1.0 (2026-06-12): removed the
    AL fallback machinery (adaptive helper/script, day/night look writes to
    light_group) and the unused single-tap LED effect inputs.\n"
  domain: automation
  source_url: https://raw.githubusercontent.com/mnestrud/ha_random/refs/heads/main/Ataraxia%20Lighting%20-%20Switch%20Taps%20Automation.yaml
  input:
    inovelli_device:
      name: Inovelli switch (Zigbee2MQTT)
      selector:
        device:
          filter:
          - integration: mqtt
          multiple: false
    enable_config_buttons:
      name: Enable Config buttons (Day/Night)
      description: If OFF, all Config button behavior is disabled.
      default: true
      selector:
        boolean: {}
    light_group:
      name: Light target (single light or Zigbee group)
      selector:
        entity:
          domain:
          - light
          reorder: false
          multiple: false
    accent_lights:
      name: Accent Lights (optional, multiple)
      description: 'Lights to toggle as accent: ON with up_single, OFF with down_single
        and on config taps. No brightness/color/transition sent.'
      default: []
      selector:
        entity:
          multiple: true
          filter:
          - domain:
            - light
          reorder: false
    accent_occupancy_timer:
      name: Accent Lights Occupancy Timer (optional)
      description: If set, this timer will be cancelled whenever accent lights are
        turned ON by up_single.
      default: []
      selector:
        entity:
          domain:
          - timer
          reorder: false
          multiple: false
    up_single_action:
      name: Up Single Action
      description: Optional action to run on up_single (scene/script/light).
      default: []
      selector:
        entity:
          filter:
          - domain:
            - scene
          - domain:
            - script
          - domain:
            - light
          reorder: false
          multiple: false
    up_single_light_mode:
      name: Up Single • Light mode
      default: toggle
      selector:
        select:
          options:
          - 'on'
          - 'off'
          - toggle
          custom_value: false
          multiple: false
          sort: false
    down_single_action:
      name: Down Single Action
      description: Optional action to run on down_single (scene/script/light).
      default: []
      selector:
        entity:
          filter:
          - domain:
            - scene
          - domain:
            - script
          - domain:
            - light
          reorder: false
          multiple: false
    down_single_light_mode:
      name: Down Single • Light mode
      default: toggle
      selector:
        select:
          options:
          - 'on'
          - 'off'
          - toggle
          custom_value: false
          multiple: false
          sort: false
    up_double_action:
      name: Up Double Action
      default: []
      selector:
        entity:
          filter:
          - domain:
            - scene
          - domain:
            - script
          - domain:
            - light
          reorder: false
          multiple: false
    up_double_light_mode:
      name: Up Double • Light mode
      default: toggle
      selector:
        select:
          options:
          - 'on'
          - 'off'
          - toggle
          custom_value: false
          multiple: false
          sort: false
    down_double_action:
      name: Down Double Action
      default: []
      selector:
        entity:
          filter:
          - domain:
            - scene
          - domain:
            - script
          - domain:
            - light
          reorder: false
          multiple: false
    down_double_light_mode:
      name: Down Double • Light mode
      default: toggle
      selector:
        select:
          options:
          - 'on'
          - 'off'
          - toggle
          custom_value: false
          multiple: false
          sort: false
    up_triple_action:
      name: Up Triple Action
      default: []
      selector:
        entity:
          filter:
          - domain:
            - scene
          - domain:
            - script
          - domain:
            - light
          reorder: false
          multiple: false
    up_triple_light_mode:
      name: Up Triple • Light mode
      default: toggle
      selector:
        select:
          options:
          - 'on'
          - 'off'
          - toggle
          custom_value: false
          multiple: false
          sort: false
    down_triple_action:
      name: Down Triple Action
      default: []
      selector:
        entity:
          filter:
          - domain:
            - scene
          - domain:
            - script
          - domain:
            - light
          reorder: false
          multiple: false
    down_triple_light_mode:
      name: Down Triple • Light mode
      default: toggle
      selector:
        select:
          options:
          - 'on'
          - 'off'
          - toggle
          custom_value: false
          multiple: false
          sort: false
    default_led_level:
      name: Default LED level (1–100)
      description: 'LED brightness when in normal adaptive mode.'
      default: 25
      selector:
        number:
          min: 1.0
          max: 100.0
          step: 1.0
          mode: slider
    led_script:
      name: Inovelli LED effect script
      description: 'Must accept: led, color, level, effect, duration, target'
      default: script.inovelli_blue_led_2025_1
      selector:
        entity:
          filter:
          - domain:
            - script
          reorder: false
          multiple: false
    up_double_effect:
      name: up_double • Effect (blank = none)
      default: ''
      selector:
        select:
          custom_value: true
          options:
          - 'Off'
          - Clear
          - Solid
          - Aurora
          - Slow Chase
