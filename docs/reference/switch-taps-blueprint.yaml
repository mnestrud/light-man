variables:
  switch_device: !input inovelli_device
  enable_config_buttons: !input enable_config_buttons
  accent_lights: !input accent_lights
  accent_timer: !input accent_occupancy_timer
  up_single_action: !input up_single_action
  down_single_action: !input down_single_action
  up_single_light_mode: !input up_single_light_mode
  down_single_light_mode: !input down_single_light_mode
  up_double_action_var: !input up_double_action
  down_double_action_var: !input down_double_action
  up_double_light_mode_var: !input up_double_light_mode
  down_double_light_mode_var: !input down_double_light_mode
  up_triple_action_var: !input up_triple_action
  down_triple_action_var: !input down_triple_action
  up_triple_light_mode_var: !input up_triple_light_mode
  down_triple_light_mode_var: !input down_triple_light_mode
  default_led_level_val: !input default_led_level
  eff_up_double: !input up_double_effect
  eff_down_double: !input down_double_effect
  eff_up_triple: !input up_triple_effect
  eff_down_triple: !input down_triple_effect
  up_held_targets: !input up_held_targets
  down_held_targets: !input down_held_targets
  held_step_pct: !input held_step_pct
  held_interval: !input held_interval
  held_transition: !input held_transition
  up_max_brightness_pct: !input up_max_brightness_pct
  down_min_brightness_pct: !input down_min_brightness_pct
  led_target_light: '{{ device_entities(switch_device) | select(''match'', ''^light\\.'')
    | list | first }}

    '
  has_accent: '{{ accent_lights != [] }}

    '
triggers:
- trigger: device
  domain: mqtt
  device_id: !input inovelli_device
  type: action
  subtype: config_single
  id: SCENE_NIGHT
- trigger: device
  domain: mqtt
  device_id: !input inovelli_device
  type: action
  subtype: config_double
  id: SCENE_DAY
- trigger: device
  domain: mqtt
  device_id: !input inovelli_device
  type: action
  subtype: up_single
  id: ACTION_UP_SINGLE_AL_LIVE
- trigger: device
  domain: mqtt
  device_id: !input inovelli_device
  type: action
  subtype: down_single
  id: ACTION_DOWN_SINGLE_AL_PRESTAGE
- trigger: device
  domain: mqtt
  device_id: !input inovelli_device
  type: action
  subtype: up_double
  id: ACTION_UP_DOUBLE
- trigger: device
  domain: mqtt
  device_id: !input inovelli_device
  type: action
  subtype: down_double
  id: ACTION_DOWN_DOUBLE
- trigger: device
  domain: mqtt
  device_id: !input inovelli_device
  type: action
  subtype: up_triple
  id: ACTION_UP_TRIPLE
- trigger: device
  domain: mqtt
  device_id: !input inovelli_device
  type: action
  subtype: down_triple
  id: ACTION_DOWN_TRIPLE
- trigger: device
  domain: mqtt
  device_id: !input inovelli_device
  type: action
  subtype: up_held
  id: ACTION_UP_HELD
- trigger: device
  domain: mqtt
  device_id: !input inovelli_device
  type: action
  subtype: down_held
  id: ACTION_DOWN_HELD
- trigger: device
  domain: mqtt
  device_id: !input inovelli_device
  type: action
  subtype: up_release
  id: ACTION_UP_RELEASE_A
- trigger: device
  domain: mqtt
  device_id: !input inovelli_device
  type: action
  subtype: up_released
  id: ACTION_UP_RELEASE_B
- trigger: device
  domain: mqtt
  device_id: !input inovelli_device
  type: action
  subtype: down_release
  id: ACTION_DOWN_RELEASE_A
- trigger: device
  domain: mqtt
  device_id: !input inovelli_device
  type: action
  subtype: down_released
  id: ACTION_DOWN_RELEASE_B
- trigger: state
  entity_id: !input light_group
  to: 'off'
  for:
    seconds: 1
  id: RESET_LED
conditions: []
actions:
- choose:
  - conditions:
    - condition: trigger
      id: SCENE_DAY
    - condition: template
      value_template: '{{ enable_config_buttons }}'
    sequence:
    - if:
      - condition: template
        value_template: '{{ has_accent }}'
      then:
      - action: light.turn_off
        target:
          entity_id: '{{ accent_lights }}'
    - if:
      - condition: template
        value_template: '{{ (led_target_light | string | trim) != "" }}'
      then:
      - action: !input led_script
        data:
          led: All
          color: White
          level: '{{ default_led_level_val }}'
          effect: Solid
          duration: Indefinitely
          target:
            entity_id: '{{ led_target_light }}'
  - conditions:
    - condition: trigger
      id: SCENE_NIGHT
    - condition: template
      value_template: '{{ enable_config_buttons }}'
    sequence:
    - if:
      - condition: template
        value_template: '{{ has_accent }}'
      then:
      - action: light.turn_off
        target:
          entity_id: '{{ accent_lights }}'
    - if:
      - condition: template
        value_template: '{{ (led_target_light | string | trim) != "" }}'
      then:
      - action: !input led_script
        data:
          led: All
          color: 6
          level: '{{ default_led_level_val }}'
          effect: Solid
          duration: Indefinitely
          target:
            entity_id: '{{ led_target_light }}'
  - conditions:
    - condition: trigger
      id:
      - ACTION_UP_SINGLE_AL_LIVE
      - ACTION_DOWN_SINGLE_AL_PRESTAGE
    sequence:
    - choose:
      - conditions:
        - condition: trigger
          id: ACTION_UP_SINGLE_AL_LIVE
        sequence:
        - if:
          - condition: template
            value_template: '{{ has_accent }}'
          then:
          - action: light.turn_on
            target:
              entity_id: '{{ accent_lights }}'
          - if:
            - condition: template
              value_template: '{{ accent_timer != [] }}'
            then:
            - action: timer.cancel
              target:
                entity_id: '{{ accent_timer }}'
      - conditions:
        - condition: trigger
          id: ACTION_DOWN_SINGLE_AL_PRESTAGE
        sequence:
        - if:
          - condition: template
            value_template: '{{ has_accent }}'
          then:
          - action: light.turn_off
            target:
              entity_id: '{{ accent_lights }}'
    - choose:
      - conditions:
        - condition: trigger
          id: ACTION_UP_SINGLE_AL_LIVE
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ up_single_action != [] and (up_single_action | string)[:7]
                == ''script.'' }}'
            sequence:
            - action: script.turn_on
              target:
                entity_id: !input up_single_action
          - conditions:
            - condition: template
              value_template: '{{ up_single_action != [] and (up_single_action | string)[:6]
                == ''scene.'' }}'
            sequence:
            - action: scene.turn_on
              target:
                entity_id: !input up_single_action
          - conditions:
            - condition: template
              value_template: '{{ up_single_action != [] and (up_single_action | string)[:6]
                == ''light.'' }}'
            sequence:
            - choose:
              - conditions:
                - condition: template
                  value_template: '{{ up_single_light_mode == ''on'' }}'
                sequence:
                - action: light.turn_on
                  target:
                    entity_id: !input up_single_action
              - conditions:
                - condition: template
                  value_template: '{{ up_single_light_mode == ''off'' }}'
                sequence:
                - action: light.turn_off
                  target:
                    entity_id: !input up_single_action
              - conditions:
                - condition: template
                  value_template: '{{ up_single_light_mode == ''toggle'' }}'
                sequence:
                - action: light.toggle
                  target:
                    entity_id: !input up_single_action
      - conditions:
        - condition: trigger
          id: ACTION_DOWN_SINGLE_AL_PRESTAGE
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ down_single_action != [] and (down_single_action
                | string)[:7] == ''script.'' }}'
            sequence:
            - action: script.turn_on
              target:
                entity_id: !input down_single_action
          - conditions:
            - condition: template
              value_template: '{{ down_single_action != [] and (down_single_action
                | string)[:6] == ''scene.'' }}'
            sequence:
            - action: scene.turn_on
              target:
                entity_id: !input down_single_action
          - conditions:
            - condition: template
              value_template: '{{ down_single_action != [] and (down_single_action
                | string)[:6] == ''light.'' }}'
            sequence:
            - choose:
              - conditions:
                - condition: template
                  value_template: '{{ down_single_light_mode == ''on'' }}'
                sequence:
                - action: light.turn_on
                  target:
                    entity_id: !input down_single_action
              - conditions:
                - condition: template
                  value_template: '{{ down_single_light_mode == ''off'' }}'
                sequence:
                - action: light.turn_off
                  target:
                    entity_id: !input down_single_action
              - conditions:
                - condition: template
                  value_template: '{{ down_single_light_mode == ''toggle'' }}'
                sequence:
                - action: light.toggle
                  target:
                    entity_id: !input down_single_action
    - choose:
      - conditions:
        - condition: trigger
          id: ACTION_DOWN_SINGLE_AL_PRESTAGE
        sequence:
        - if:
          - condition: template
            value_template: '{{ (led_target_light | string | trim) != "" }}'
          then:
          - action: !input led_script
            data:
              led: All
              color: Blue
              level: 100
              effect: Clear
              duration: Indefinitely
              target:
                entity_id: '{{ led_target_light }}'
  - conditions:
    - condition: trigger
      id: RESET_LED
    sequence:
    - if:
      - condition: template
        value_template: '{{ (led_target_light | string | trim) != "" }}'
      then:
      - action: !input led_script
        data:
          led: All
          color: Blue
          level: 100
          effect: Clear
          duration: Indefinitely
          target:
            entity_id: '{{ led_target_light }}'
  - conditions:
    - condition: trigger
      id:
      - ACTION_UP_HELD
      - ACTION_DOWN_HELD
    sequence:
    - variables:
        _targets: "{% if trigger.id == 'ACTION_UP_HELD' %}\n  {{ up_held_targets }}\n{%
          else %}\n  {{ down_held_targets }}\n{% endif %}"
        _step: "{% if trigger.id == 'ACTION_UP_HELD' %}\n  {{ held_step_pct | int
          }}\n{% else %}\n  {{ (held_step_pct | int) * -1 }}\n{% endif %}"
    - if:
      - condition: template
        value_template: '{{ _targets != [] }}'
      then:
      - repeat:
          sequence:
          - wait_for_trigger:
            - platform: device
              domain: mqtt
              device_id: !input inovelli_device
              type: action
              subtype: up_release
            - platform: device
              domain: mqtt
              device_id: !input inovelli_device
              type: action
              subtype: up_released
            - platform: device
              domain: mqtt
              device_id: !input inovelli_device
              type: action
              subtype: down_release
            - platform: device
              domain: mqtt
              device_id: !input inovelli_device
              type: action
              subtype: down_released
            timeout: '{{ held_interval }}'
            continue_on_timeout: true
          - variables:
              _min_raw: '{{ ((down_min_brightness_pct | int) * 255 / 100) | round(0)
                | int }}'
              _max_raw: '{{ ((up_max_brightness_pct | int) * 255 / 100) | round(0)
                | int }}'
              _any_at_or_below_min: "{{\n  expand(_targets)\n  | selectattr('attributes.brightness','defined')\n
                \ | map(attribute='attributes.brightness')\n  | select('le', _min_raw)\n
                \ | list | count > 0\n}}"
              _any_at_or_above_max: "{{\n  expand(_targets)\n  | selectattr('attributes.brightness','defined')\n
                \ | map(attribute='attributes.brightness')\n  | select('ge', _max_raw)\n
                \ | list | count > 0\n}}"
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ _step < 0 }}'
              - condition: template
                value_template: '{{ _any_at_or_below_min }}'
              sequence:
              - action: light.turn_on
                target:
                  entity_id: '{{ _targets }}'
                data:
                  brightness_pct: '{{ down_min_brightness_pct | int }}'
                  transition: '{{ held_transition }}'
            - conditions:
              - condition: template
                value_template: '{{ _step > 0 }}'
              - condition: template
                value_template: '{{ _any_at_or_above_max }}'
              sequence:
              - action: light.turn_on
                target:
                  entity_id: '{{ _targets }}'
                data:
                  brightness_pct: '{{ up_max_brightness_pct | int }}'
                  transition: '{{ held_transition }}'
            - conditions: []
              sequence:
              - action: light.turn_on
                target:
                  entity_id: '{{ _targets }}'
                data:
                  brightness_step_pct: '{{ _step }}'
                  transition: '{{ held_transition }}'
            default: []
          until:
          - condition: template
            value_template: '{{ wait.completed }}'
