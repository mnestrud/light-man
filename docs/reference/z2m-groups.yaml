# Zigbee2MQTT group definitions (from /config/zigbee2mqtt/configuration.yaml, 2026-06-06).
# IMPORTANT: Z2M stores group *membership* in database.db, NOT in configuration.yaml. The membership
# lists below are RECONSTRUCTED from the Z2M network map + tick wiring and must be verified against
# the live group state (bridge/request/groups or the Z2M frontend) — this is a Phase-1 pre-check.

# ----- Group definitions (verbatim) -----
groups:
  "1":  { friendly_name: zgb_living_room,           hue_native_control: true }
  "2":  { friendly_name: zgb_kitchen,               hue_native_control: true }
  "3":  { friendly_name: zgb_stairwell,             hue_native_control: true }
  "4":  { friendly_name: zgb_primary_bedroom,       hue_native_control: true }
  "5":  { friendly_name: zgb_overhead_bath,         hue_native_control: true }
  "6":  { friendly_name: zgb_primary_shower_lights, hue_native_control: true }
  "7":  { friendly_name: zgb_office_overhead,       hue_native_control: true }
  "8":  { friendly_name: zgb_hallway_up,            hue_native_control: true }
  "9":  { friendly_name: zgb_hallway_down,          hue_native_control: true }
  "15": { friendly_name: zgb_effie_closet_overhead }                          # no AL script
  "16": { friendly_name: zgb_upstairs_bath,         hue_native_control: true }
  "17": { friendly_name: zgb_kitchen_island,        hue_native_control: true }
  "21": { friendly_name: zgb_hallwayf }
  "30": { friendly_name: zgb_overhead_all,          hue_native_control: true } # consolidated overhead
  "31": { friendly_name: zgb_accent_all,            hue_native_control: true } # consolidated accent

# ----- Consolidated source -> per-room group mapping (confident, from tick wiring) -----
# zgb_overhead_all (30) = union of the 10 overhead per-room groups:
#   zgb_primary_bedroom, zgb_overhead_bath, zgb_primary_shower_lights, zgb_office_overhead,
#   zgb_kitchen, zgb_living_room, zgb_stairwell, zgb_upstairs_bath + michael-closet + front-door bulbs.
# zgb_accent_all (31) = under-vanity strip + the 2 kitchen-island bulbs.
# zgb_hallway_up (8) / zgb_hallway_down (9) = hallway up/down lights (already per-source).
#
# Every bulb is a member of BOTH its per-room group AND the consolidated source group. Per-room groups
# + the Inovelli SBM bindings are untouched by the consolidation; the consolidated groups exist purely
# for the AL flood. Removing a bulb from a consolidated group (the Light Man hold mechanism) does NOT
# affect its per-room group or the switch binding -> paddle on/off keeps working during a hold.

# ----- Reconstructed zgb_overhead_all membership (VERIFY against database.db) -----
